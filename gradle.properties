org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# CI (GitHub ubuntu runners) and desktop builds use AGP's bundled aapt2 from the
# installed build-tools. Do NOT pin android.aapt2FromMavenOverride to a host path
# here — it was previously set to a Termux path which broke CI (aapt2 missing).
# For local Termux builds, set that override in ~/.gradle/gradle.properties instead.
