name: Android CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build · Lint · Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Kotlin formatting (ktlint)
        run: ./gradlew ktlintCheck || ./gradlew --no-daemon ktlintCheck
      - name: Static analysis (detekt)
        run: ./gradlew detekt || true   # non-blocking until baseline established
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Android lint
        run: ./gradlew lintDebug --no-daemon
      - name: Architecture boundary check
        run: ./gradlew architectureBoundaryCheck || echo "boundary check not yet wired"
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        with:
          args: detect --redact --no-git --exit-code=1 --report-format=sarif --report-path=results.sarif
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/reports/**

  ui-test:
    name: Compose UI Tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "system-images;android-34;google_apis;x86_64"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Grant execute permission
        run: chmod +x ./gradlew
      - name: Run instrumented Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest --no-daemon
