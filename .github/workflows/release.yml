name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Generate signing keystore
        run: |
          KEYSTORE=$GITHUB_WORKSPACE/hermes-release.keystore
          KEY_ALIAS=hermes
          STORE_PASS=hermes-release-$(date +%s)
          KEY_PASS=$STORE_PASS
          keytool -genkey -v -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Hermes Agent, OU=Hermes, O=Hermes, L=Unknown, S=Unknown, C=US" \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS"
          echo "STORE_FILE=$KEYSTORE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK (R8 minified)
        run: ./gradlew assembleRelease --no-daemon -PRELEASE_STORE_FILE="$STORE_FILE" -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" -PRELEASE_KEY_ALIAS="$KEY_ALIAS" -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Locate built APK
        id: locate
        run: |
          APK=$(find app/build/outputs -name '*.apk' | head -n 1)
          echo "Found APK: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.apk }}
          name: Hermes Agent ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
